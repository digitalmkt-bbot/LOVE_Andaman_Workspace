# The new platform is deployed as its own Railway service with Root Directory `platform`.
# Run pnpm via npm exec: Railway's bundled Corepack cannot execute pnpm 11 on Node 22.
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm exec --yes --package=pnpm@11.22.0 -- pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["npm exec --yes --package=pnpm@11.22.0 -- pnpm --filter @la/ops-web build"]

[start]
cmd = "./node_modules/.bin/vite preview --host 0.0.0.0 --port $PORT"
